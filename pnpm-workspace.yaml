strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 10080 # minutes = 7 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # minutes = 30 days

allowBuilds:
  # Reached via jest-haste-map (watch mode only). Its install script is a
  # node-gyp fallback; the prebuilt platform package is used instead.
  '@parcel/watcher': false
  bufferutil: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  fsevents: true
  keccak: true
  postinstall-postinstall: true
  secp256k1: true
  unrs-resolver: true
  utf-8-validate: true
  web3: true
  web3-bzz: true
  web3-shh: true

overrides:
  'elliptic': '^6.6.1'
  'pbkdf2': '^3.1.5'
  'form-data': '^4.0.6'
  # eth-sig-util@1.4.2 declares ethereumjs-abi as an unpinned git URL, which
  # blockExoticSubdeps rejects. Pin the equivalent registry release instead.
  'ethereumjs-abi': '^0.6.8'
  # cuer@0.0.3 (pinned by RainbowKit) passes border: 0, rejected since qr 0.6.
  # Drop once RainbowKit ships cuer@0.0.4.
  'qr': '~0.5.5'
  # Advisories reachable through the wagmi 2 connector tree (frozen upstream
  # until RainbowKit supports wagmi 3); each pin is the patched minor.
  'ws@7': '^7.5.11'
  'ws@8': '^8.21.0'
  'h3': '^1.15.9'
  'picomatch@2': '^2.3.2'
  'preact': '^10.27.3'
  'defu': '^6.1.5'
  'bn.js@5': '^5.2.3'
  'decode-uri-component': '^0.5.0'
  'uuid@8': '^11.1.1'
  'uuid@9': '^11.1.1'
