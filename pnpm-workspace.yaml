strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 10080 # minutes = 7 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # minutes = 30 days

allowBuilds:
  # Reached via jest-haste-map (watch mode only). Its install script is a
  # node-gyp fallback; the prebuilt platform package is used instead.
  '@parcel/watcher': false
  bufferutil: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  fsevents: true
  keccak: true
  postinstall-postinstall: true
  secp256k1: true
  unrs-resolver: true
  utf-8-validate: true
  web3: true
  web3-bzz: true
  web3-shh: true

overrides:
  'elliptic': '^6.6.1'
  'pbkdf2': '^3.1.5'
  'form-data': '^4.0.4'
  # eth-sig-util@1.4.2 declares ethereumjs-abi as an unpinned git URL, which
  # blockExoticSubdeps rejects. Pin the equivalent registry release instead.
  'ethereumjs-abi': '^0.6.8'
  # RainbowKit pins cuer@0.0.3, which calls qr's encodeQR with border: 0;
  # qr >=0.6 rejects that (RangeError: invalid border=0) and breaks the
  # WalletConnect QR screen. cuer@0.0.4 fixes it; drop this once RainbowKit
  # ships that version.
  'qr': '~0.5.5'
